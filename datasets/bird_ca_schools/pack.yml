name: bird_ca_schools
lineage_namespace: bird_ca_schools
source:
  type: sqlite
  path: source/california_schools.sqlite
  tables: [schools, frpm, satscores]
destination:
  type: duckdb
  path: data/bird_ca_schools.duckdb
  dataset: bronze
semantics:
  backend: cube
  cube: semantics/cube
  metrics:
    - semantics/school_count.yml
    - semantics/total_enrollment.yml
    - semantics/avg_sat_math.yml
golden: golden.yml

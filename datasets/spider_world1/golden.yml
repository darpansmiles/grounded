# Golden set (slice 039 expansion) — spider_world1: 48 categorized cases.
# category enum: ['total', 'by_dimension', 'by_multi_dimension', 'ranking', 'paraphrase', 'role_governed', 'describe', 'impact', 'policy', 'refuse_out_of_scope', 'refuse_adversarial']
# Schema: case_id, question, role, category, expected_plan{tool,args}, expect{type[,decision]}.
# In-scope ground truth = the governed arm (computed at run). Refusal cases expect a refusal.
# score_routing does exact normalized-args match for non-refuse tools.


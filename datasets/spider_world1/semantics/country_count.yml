metric: country_count
label: Country Count
description: Count of declared Spider world countries.
owner: darpan
definition:
  measure: count(country.Code)
  grain: country
dimensions:
  - {name: continent, source: country.Continent}
  - {name: region, source: country.Region}
lineage:
  cube_member: Country.country_count
  model: none
  tables: [bronze.country]
  sources: [spider_world1.sqlite]
policies:
  - id: row_europe_only
    applies_to: country.Continent
    cube_member: Country.continent
    operator: equals
    values: [Europe]
    rule: row_filter
    predicate: "continent = 'Europe'"
    when_role: [eu_analyst]
verification:
  - {type: non_negative, field: country_count}

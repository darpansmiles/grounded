name: spider_world1
lineage_namespace: spider_world1
source:
  type: sqlite
  path: source/world_1.sqlite
  tables: [country, city, countrylanguage]
destination:
  type: duckdb
  path: data/spider_world1.duckdb
  dataset: bronze
semantics:
  backend: cube
  cube: semantics/cube
  metrics:
    - semantics/total_population.yml
    - semantics/country_count.yml
    - semantics/total_gnp.yml
golden: golden.yml

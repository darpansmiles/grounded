# Fixture PoC golden (category-tagged for the 039 validator).

- case_id: rev-cat-canonical
  question: What was revenue last month by product category?
  role: viewer
  expected_plan:
    tool: query_metric
    args:
      metric: revenue
      dimensions:
      - category
      filters:
        order_month: last_month
  expect:
    type: metric
  category: by_dimension
- case_id: rev-cat-paraphrase-earn
  question: How much did each product category earn last month?
  role: viewer
  note: Paraphrase without the word 'revenue' — trips keyword planners.
  expected_plan:
    tool: query_metric
    args:
      metric: revenue
      dimensions:
      - category
      filters:
        order_month: last_month
  expect:
    type: metric
  category: by_dimension
- case_id: rev-cat-paraphrase-sales
  question: Break down last month's sales by category.
  role: viewer
  note: '''sales'' ≈ revenue; still the revenue metric.'
  expected_plan:
    tool: query_metric
    args:
      metric: revenue
      dimensions:

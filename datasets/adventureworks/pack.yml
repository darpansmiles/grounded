name: adventureworks
lineage_namespace: adventureworks
source:
  type: postgres
  load: source/load.sh
  tables:
    - sales.salesorderheader
    - sales.salesorderdetail
    - sales.customer
    - sales.salesterritory
    - production.product
    - production.productsubcategory
    - production.productcategory
    - person.person
    - person.emailaddress
  connection:
    dsn_env: GROUNDED_ADVENTUREWORKS_SOURCE_DSN
destination:
  type: duckdb
  path: data/adventureworks.duckdb
  dataset: bronze
transform: transform/
semantics:
  backend: cube
  cube: semantics/cube/
  metrics:
    - semantics/revenue.yml
    - semantics/orders.yml
    - semantics/aov.yml
    - semantics/units_sold.yml
    - semantics/customers.yml
    - semantics/average_unit_price.yml
    - semantics/revenue_per_customer.yml
    - semantics/orders_per_customer.yml
golden: golden.yml

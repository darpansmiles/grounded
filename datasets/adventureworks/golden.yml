# Golden set (slice 039 expansion) — adventureworks: 105 categorized cases.
# category enum: ['total', 'by_dimension', 'by_multi_dimension', 'ranking', 'paraphrase', 'role_governed', 'describe', 'impact', 'policy', 'refuse_out_of_scope', 'refuse_adversarial']

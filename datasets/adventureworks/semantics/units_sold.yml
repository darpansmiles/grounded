metric: units_sold
label: Units Sold
description: Total units on completed sales-order lines.
owner: darpan
definition:
  measure: sum(fct_sales.quantity)
  grain: order_line
  filter: fct_sales.is_completed = true
dimensions:
  - {name: category, source: products.category}
  - {name: order_month, source: orders.order_ts, granularity: month}
  - {name: country, source: customers.country}
lineage: &aw_lineage
  cube_member: Sales.units_sold
  model: sqlmesh:gold.fct_sales
  tables: [gold.fct_sales, silver.stg_sales_order_line, bronze.salesorderdetail]
  sources: [postgres.adventureworks]
policies: &aw_policies
  - id: pii-mask-email
    applies_to: customers.email
    rule: mask
    unless_role: [analyst_pii, admin]
  - id: row-eu-only
    applies_to: customers.country
    cube_member: Sales.country
    operator: in
    values: ['DE', 'FR', 'NL']
    rule: row_filter
    predicate: "country IN ('DE','FR','NL')"
    when_role: [eu_analyst]
verification:
  - {type: non_negative, field: units_sold}

# Make supplies `-p grounded-<dataset>` for data-stack commands. There is no
# hardcoded container_name, so Compose prefixes the active dataset automatically.
name: grounded

services:
  postgres:
    image: postgres@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
    environment:
      POSTGRES_DB: ${GROUNDED_SOURCE_DATABASE:-grounded}
      POSTGRES_USER: ${GROUNDED_SOURCE_USERNAME:-grounded}
      POSTGRES_PASSWORD: ${GROUNDED_SOURCE_PASSWORD:-grounded_local_password}
    ports:
      - "${SOURCE_HOST_PORT:-5433}:5432"
    volumes:
      - grounded_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  cube:
    image: cubejs/cube@sha256:3cffbfaa0cdbb371f1517c74ac5f2fee26d8b00ad1ae20a2654fa698890af1df
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: duckdb
      CUBEJS_DB_DUCKDB_DATABASE_PATH: /cube/data/${GROUNDED_PACK_DATABASE:-adventureworks.duckdb}
    ports:
      - "${CUBE_HOST_PORT:-4000}:4000"
    volumes:
      - ../${GROUNDED_PACK_SEMANTICS:-.}:/cube/conf
      - ../data:/cube/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/readyz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  marquez-db:
    image: postgres@sha256:90bf57b1075a7f70b6592a50659a2aaf2adacd2d7da5752e479449cc9d758721
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  marquez:
    image: marquezproject/marquez@sha256:6d8a2c2cdb28a4f6d13f9ca6f8cc055d8312c4dee204ebeb848efdd76e6ab30e
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      SEARCH_ENABLED: "false"
    ports:
      - "5050:5000"
      - "5051:5001"
    depends_on:
      marquez-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  marquez-web:
    image: marquezproject/marquez-web@sha256:e8d53e10ab141cde1b121b01ff47776a58b407813fb6e10f490842d20c184346
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3000:3000"
    depends_on:
      marquez:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  grounded_postgres_data:
  marquez_postgres_data:

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded"
version = "0.1.0"
description = "Governed, verified, audited metric answers for agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dlt[duckdb,sql_database]>=1.30",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "mcp>=2.0",
  "psutil>=7.2",
  "psycopg2-binary>=2.9",
  "pytest>=9.0",
  "sqlmesh>=0.236",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "audit*", "datasets*", "evals*", "governed*", "harness*", "infra*", "models*", "ontology*", "packlib*", "policy*", "rag*", "resolver*", "semantics*", "verify*"]
exclude = ["specs*", "tests*"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
  "pip-audit",
  "httpx>=0.27",
]
postgres = ["psycopg2-binary"]
duckdb = ["duckdb"]
mysql = ["pymysql"]
all = ["psycopg2-binary", "duckdb", "pymysql"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests with mocks",
  "integration: tests spanning multiple modules",
  "e2e: full workflow end-to-end tests",
  "slow: tests taking more than 5 seconds",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
